
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CampusFlow - Academic Workspace</title>

    <meta name="description" content="CampusFlow Academic Hub - Platform ruang kerja akademik mahasiswa.">

    <meta name="theme-color" content="#963c53">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #fff5f5, #f5dce2);
            color: #3f0016;
            padding: 20px;
        }

        .loading {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 20px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(63, 0, 22, 0.08);
        }

        .logo {
            font-size: 32px;
            font-weight: bold;
            color: #963c53;
            margin-bottom: 15px;
        }

        p {
            margin-top: 12px;
            color: #777;
            line-height: 1.6;
        }

        .loader {
            width: 35px;
            height: 35px;
            margin: 25px auto;
            border: 4px solid #f5dce2;
            border-top-color: #963c53;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        a {
            display: inline-block;
            margin-top: 15px;
            color: #963c53;
            font-weight: bold;
            text-decoration: none;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div class="loading">
        <div class="logo">CampusFlow</div>

        <h2>Memuat Academic Hub...</h2>

        <div class="loader"></div>

        <p>
            Sedang mengarahkan kamu ke halaman utama CampusFlow.
        </p>

        <a href="./stitch_campusflow_academic_design/login_campusflow_2/code.html">
            Klik di sini jika tidak dialihkan otomatis
        </a>
    </div>

    <script>
        window.location.replace(
            "./stitch_campusflow_academic_design/login_campusflow_2/code.html"
        );
    </script>

</body>
</html>
